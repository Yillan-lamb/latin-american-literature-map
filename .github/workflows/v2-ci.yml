name: Web Development CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-baseline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Validate review package and research data
        run: |
          python3 scripts/validate_master.py data/master/V1_MASTER.sqlite
          python3 scripts/validate_v2_content_quality.py
      - name: Rebuild review-stage Web Data in isolation
        run: |
          rm -rf /tmp/v2-review-web
          python3 scripts/build_v2_web_data.py --output-dir /tmp/v2-review-web --generated-at 2026-08-27T12:00:00Z
      - name: Check review-stage Web Data has no unexpected diff
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          pairs = (
              (Path("data/v2/web/site_data.json"), Path("/tmp/v2-review-web/site_data.json")),
              (Path("data/v2/web/manifest.json"), Path("/tmp/v2-review-web/manifest.json")),
          )
          for committed_path, rebuilt_path in pairs:
              committed = json.loads(committed_path.read_text(encoding="utf-8"))
              rebuilt = json.loads(rebuilt_path.read_text(encoding="utf-8"))
              committed.pop("generated_at", None)
              rebuilt.pop("generated_at", None)
              if committed != rebuilt:
                  raise SystemExit(f"unexpected Web Data rebuild diff: {committed_path}")
          PY
      - name: Check frontend syntax and whitespace
        run: |
          node --check site/app.js
          git diff --check

  web-pr-browser-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install locked Chromium QA dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build local Web 0.x review preview
        run: python3 scripts/build_v2_user_review_preview.py
      - name: Run Chromium desktop and mobile map smoke
        run: |
          python3 -m http.server 4173 --directory artifacts/v2-rc5/user-review-preview > /tmp/web-pr-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run qa:browser:chromium

  release-integrity:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_ARTIFACT: v2-rc5-candidate-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install locked QA dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate research data
        run: python3 scripts/validate_master.py data/master/V1_MASTER.sqlite
      - name: Rebuild and validate Web Data
        run: |
          python3 scripts/validate_v2_content_quality.py
          python3 scripts/build_v2_web_data.py --generated-at 2026-08-27T12:00:00Z
          python3 scripts/validate_v2_web_data.py
      - name: Check frontend syntax and whitespace
        run: |
          node --check site/app.js
          git diff --check
          git diff --exit-code -- data/v2/web/site_data.json data/v2/web/manifest.json
      - name: Build the one public deployment bundle
        run: python3 scripts/build_v2_deploy_bundle.py --output dist --origin https://example.invalid/
      - name: Validate the actual public bundle
        run: |
          python3 scripts/qa_v2_public_ui.py dist
          python3 scripts/validate_v2_public_bundle.py dist
      - name: Run Chromium desktop and mobile smoke tests
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/v2-http.log 2>&1 &
          npm run qa:browser:chromium
      - name: Materialize and verify exact candidate manifest
        run: |
          python3 scripts/build_v2_release_manifest.py --output /tmp/V2.0.0-rc.5.manifest.json --bundle dist --candidate-commit-sha "$CANDIDATE_SHA"
          python3 scripts/build_v2_release_manifest.py --verify --output /tmp/V2.0.0-rc.5.manifest.json --bundle dist --require-release-state pending_v2_n4
          python3 scripts/assert_v2_candidate_identity.py --candidate-sha "$CANDIDATE_SHA" --manifest /tmp/V2.0.0-rc.5.manifest.json --artifact-name "$CANDIDATE_ARTIFACT"
      - name: Prove tampering is rejected
        run: |
          cp -R dist /tmp/v2-tampered-dist
          printf '\n' >> /tmp/v2-tampered-dist/data/v2/web/site_data.json
          if python3 scripts/build_v2_release_manifest.py --verify --output /tmp/V2.0.0-rc.5.manifest.json --bundle /tmp/v2-tampered-dist; then
            echo "Tampered bundle was incorrectly accepted."
            exit 1
          fi
      - name: Upload candidate proof and browser raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          if-no-files-found: error
          path: |
            /tmp/V2.0.0-rc.5.manifest.json
            artifacts/v2-rc5/browser/
            dist/

  rc-browser-matrix:
    needs: release-integrity
    if: ${{ needs.release-integrity.result == 'success' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install exact browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Build final public bundle
        run: |
          python3 scripts/build_v2_web_data.py --generated-at 2026-08-27T12:00:00Z
          python3 scripts/build_v2_deploy_bundle.py --output dist --origin https://example.invalid/
      - name: Run Chromium Firefox and WebKit matrix
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/v2-http.log 2>&1 &
          npm run qa:browser
          npm run qa:lighthouse
      - name: Upload raw browser and Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-rc5-browser-matrix-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/v2-rc5/
