name: Web Development Preview on GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-development-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      V2_SITE_ORIGIN: https://yillan-lamb.github.io/latin-american-literature-map/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate source data
        run: |
          python3 scripts/validate_master.py data/master/V1_MASTER.sqlite
          python3 scripts/validate_v2_content_quality.py
      - name: Build complete review-stage Web Data
        run: python3 scripts/build_v2_user_review_preview.py
      - name: Build GitHub Pages development preview
        run: |
          python3 scripts/build_v2_deploy_bundle.py \
            --data artifacts/v2-rc5/user-review-preview-web/site_data.json \
            --output dist \
            --origin "$V2_SITE_ORIGIN" \
            --development-preview
          touch dist/.nojekyll
      - name: Validate exact Pages artifact
        run: |
          python3 scripts/qa_v2_public_ui.py dist
          python3 scripts/validate_v2_public_bundle.py dist
          node --check dist/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@v4
