<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-label="纸面质感（程序生成，无外部素材）">
  <defs>
    <filter id="fine-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope="0.38" intercept="0.48"/>
        <feFuncG type="linear" slope="0.31" intercept="0.44"/>
        <feFuncB type="linear" slope="0.21" intercept="0.37"/>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.004 0.34" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .34  0 0 0 0 .28  0 0 0 0 .20  0 0 0 .10 0"/>
    </filter>
    <filter id="soft-stain" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="flecks" width="91" height="83" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="14" r=".8" fill="#5c4930" opacity=".18"/>
      <circle cx="42" cy="9" r=".55" fill="#7a6140" opacity=".15"/>
      <circle cx="76" cy="33" r=".7" fill="#4b3a27" opacity=".13"/>
      <circle cx="23" cy="61" r=".6" fill="#6a5538" opacity=".16"/>
      <circle cx="64" cy="74" r=".45" fill="#463727" opacity=".14"/>
    </pattern>
  </defs>
  <rect width="640" height="640" fill="#eee5d2"/>
  <rect width="640" height="640" filter="url(#fine-grain)" opacity=".34"/>
  <rect width="640" height="640" filter="url(#fibers)" opacity=".25"/>
  <rect width="640" height="640" fill="url(#flecks)"/>
  <g fill="#8d6d42" opacity=".10" filter="url(#soft-stain)">
    <ellipse cx="84" cy="112" rx="92" ry="34"/>
    <ellipse cx="566" cy="508" rx="112" ry="52"/>
    <ellipse cx="382" cy="298" rx="46" ry="23"/>
  </g>
  <g stroke="#6b5438" stroke-width=".55" opacity=".10">
    <path d="M0 126 C144 118 280 137 640 120"/>
    <path d="M0 409 C183 400 365 420 640 407"/>
  </g>
</svg>
